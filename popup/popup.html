<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autofill-pro</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="panel">
      <header class="hero">
        <p class="eyebrow">Autofill-pro</p>
        <h1>Capture once, reuse anywhere</h1>
        <p id="pageMeta" class="muted"></p>
      </header>

      <section class="card">
        <label for="profileName">Profile name</label>
        <input id="profileName" type="text" placeholder="Example: Sales onboarding form">

        <label for="matchMode">Applies to</label>
        <select id="matchMode">
          <option value="site">This site</option>
          <option value="page">This exact page</option>
          <option value="path-prefix">This path prefix</option>
          <option value="custom">Custom rule</option>
        </select>

        <label for="matchValue">Match value</label>
        <input id="matchValue" type="text" placeholder="https://example.com/forms">

        <label class="toggle-row">
          <input id="autoFillOnLoad" type="checkbox" checked>
          <span>Auto-fill after page load</span>
        </label>

        <button id="captureBtn" class="primary">Capture current values</button>
      </section>

      <section class="card">
        <label for="profileSelect">Matching profiles</label>
        <select id="profileSelect"></select>

        <div class="actions">
          <button id="fillBtn" class="primary">Fill page</button>
          <button id="duplicateBtn">Duplicate</button>
          <button id="saveBtn">Save edits</button>
          <button id="deleteBtn" class="danger">Delete</button>
        </div>
      </section>

      <section class="card">
        <div class="section-head">
          <h2>Quick edits</h2>
          <button id="manageBtn" class="ghost">Manage all</button>
        </div>
        <div id="fieldEditor" class="field-editor"></div>
      </section>

      <p id="status" class="status"></p>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
