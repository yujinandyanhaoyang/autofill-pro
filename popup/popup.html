<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autofill-pro</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="panel">
      <header class="hero">
        <div class="brand">
          <img src="../assets/mark.svg" alt="" class="brand-mark">
          <div>
            <p class="eyebrow">Autofill-pro</p>
            <h1>Easy save, easy reuse</h1>
          </div>
        </div>
        <p id="pageMeta" class="muted"></p>
      </header>

      <section class="card">
        <button id="saveBtn" class="primary">Save Field Values</button>
        <p class="card-note">Updates the currently selected matching profile with this page's field values.</p>
      </section>

      <section class="card">
        <div class="summary-copy">
          <span class="section-label">Matching profiles</span>
          <label for="profileSelect" class="sr-only">Select profile</label>
          <select id="profileSelect" class="profile-select"></select>
          <small id="selectedProfileMeta" class="muted">Default is empty. Choose or create a profile.</small>
        </div>
        <div class="profile-toolbar">
          <button id="newProfileBtn" class="secondary">New Profile</button>
        </div>

        <div class="actions">
          <button id="fillBtn" class="secondary">Use on this page</button>
          <button id="manageBtn" class="ghost">Manage all</button>
        </div>
      </section>

      <p id="status" class="status"></p>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
